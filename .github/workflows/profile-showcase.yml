name: Refresh profile showcase
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
concurrency:
  group: profile-showcase
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Render public open-source contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render-contributions.py
      - name: Render night contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-night.json
          MAX_REPOS: '100'
      - name: Publish refreshed visuals
        run: |
          cp profile-3d-contrib/github-activity-night.svg assets/github-activity-night.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/open-source-dark.svg assets/open-source-light.svg assets/github-activity-night.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh public contributions and activity calendar'
          git pull --rebase origin main
          git push origin HEAD:main
