name: Refresh profile showcase
on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
concurrency:
  group: profile-showcase
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check contribution renderer
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Render public open-source contributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render-contributions.py
      - name: Render contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg?palette=github-light&color_snake=%237C3AED
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%23FACC15
      - name: Publish refreshed visuals
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add readme.md assets/open-source-*.svg assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh public contributions and snake animation'
          git pull --rebase origin main
          git push origin HEAD:main
